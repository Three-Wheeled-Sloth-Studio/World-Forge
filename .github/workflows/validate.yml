name: Validate World Forge

on:
  push:
    branches:
      - dev
      - qa
      - main
      - automation/body-fidelity-satellites-20260801
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    if: github.ref_name != 'automation/body-fidelity-satellites-20260801'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run verify

  delete-disposable-branch:
    if: github.ref_name == 'automation/body-fidelity-satellites-20260801'
    runs-on: ubuntu-latest
    steps:
      - name: Delete disposable branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            --delete automation/body-fidelity-satellites-20260801
