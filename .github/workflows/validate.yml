name: Validate World Forge

on:
  push:
    branches:
      - dev
      - qa
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run verify

      - name: Smoke production page harness
        run: npm run smoke:production-page-harness
