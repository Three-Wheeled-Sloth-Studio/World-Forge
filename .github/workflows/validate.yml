name: Validate World Forge

on:
  push:
    branches:
      - dev
      - 'release/**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:
    inputs:
      full_test_matrix:
        description: Run extended generation and geographic seed matrices
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run canonical repository verification
        run: npm run verify
        env:
          WORLD_FORGE_FULL_TEST_MATRIX: ${{ inputs.full_test_matrix && '1' || '0' }}

      - name: Smoke production page harness
        run: npm run smoke:production-page-harness

      - name: Smoke production attribution rerank
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        run: npm run smoke:production-rerank
