name: Temporary polar climate and profiling implementation

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/polar-climate-foundation-profiling'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply documented implementation
        run: python scripts/temp-apply-polar-climate-profiling.py

      - name: Remove temporary runner
        run: |
          rm scripts/temp-apply-polar-climate-profiling.py
          rm .github/workflows/temp-apply-polar-climate-profiling.yml

      - name: Commit implementation
        run: |
          git config user.name "World Forge Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Experimental polar climate and foundation profiling"
          git push origin HEAD:${{ github.head_ref }}
