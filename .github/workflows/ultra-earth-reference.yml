name: Ultra Earth Reference Diagnostic

on:
  workflow_dispatch:

concurrency:
  group: ultra-earth-reference-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  rebuild-reference:
    name: rebuild-reference
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WORLD_FORGE_SOURCE_COMMIT: ${{ github.sha }}
      NODE_OPTIONS: --max-old-space-size=12288

    steps:
      - name: Announce diagnostic run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 124 --repo "$GITHUB_REPOSITORY" --body "Ultra Earth diagnostic run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) started for commit \`${GITHUB_SHA}\`."

      - name: Checkout World Forge
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install World Forge dependencies
        run: npm ci

      - name: Install reference ETL dependencies
        run: python -m pip install -r tools/reference-etl/requirements.txt

      - name: Run focused reference-pipeline tests
        run: npx vitest run scripts/build-sol-reference-pipeline.test.ts scripts/publish-sol-starter.test.ts

      - name: Rebuild maintained Ultra Sol reference
        id: sol
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .local/reference-data/diagnostics
          set +e
          /usr/bin/time -v -o .local/reference-data/diagnostics/sol-pipeline.time.txt \
            npm run reference:build-sol \
            > >(tee .local/reference-data/diagnostics/sol-pipeline.log) \
            2> >(tee .local/reference-data/diagnostics/sol-pipeline.stderr.log >&2)
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Record World Forge build evidence
        if: always()
        shell: bash
        run: |
          mkdir -p .local/reference-data/diagnostics
          {
            echo "# Ultra Earth reference diagnostic"
            echo "commit=${GITHUB_SHA}"
            echo "sol_pipeline_status=${{ steps.sol.outputs.status || 'not-run' }}"
            echo
            echo "## memory"
            free -h
            echo
            echo "## storage"
            df -h .
            echo
            echo "## prepared/reference files"
            find .local/reference-data -maxdepth 3 -type f -printf '%s\t%p\n' 2>/dev/null | sort -nr || true
            echo
            if [[ -f .local/reference-data/sol-earth-reference.wforge ]]; then
              echo "## Sol package"
              stat --printf='bytes=%s\n' .local/reference-data/sol-earth-reference.wforge
              sha256sum .local/reference-data/sol-earth-reference.wforge
            fi
          } | tee .local/reference-data/diagnostics/world-forge-evidence.txt

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ultra-earth-reference-evidence-${{ github.run_id }}
          retention-days: 7
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .local/reference-data/diagnostics/
            .local/reference-data/earth-etopo/manifest.json
            .local/reference-data/sol-earth-reference.wforge
            .local/reference-data/sol-earth-reference.wforge.pipeline.json

      - name: Post diagnostic summary to issue 124
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          summary='.local/reference-data/diagnostics/issue-summary.md'
          mkdir -p "$(dirname "$summary")"
          {
            echo '## Ultra Earth reference diagnostic'
            echo
            echo "Run: [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Sol pipeline status: \`${{ steps.sol.outputs.status || 'not-run' }}\`"
            echo
            if [[ -f .local/reference-data/earth-etopo/manifest.json ]]; then
              echo '### Earth bundle'
              echo '```json'
              jq '{resolution, topologyResolution, summary}' .local/reference-data/earth-etopo/manifest.json
              echo '```'
              echo
            fi
            if [[ -f .local/reference-data/diagnostics/sol-pipeline.time.txt ]]; then
              echo '### Sol pipeline resources'
              echo '```text'
              grep -E 'Elapsed|Maximum resident set size|File system inputs|File system outputs|Exit status' \
                .local/reference-data/diagnostics/sol-pipeline.time.txt || true
              echo '```'
              echo
            fi
            if [[ -f .local/reference-data/sol-earth-reference.wforge ]]; then
              echo '### Sol package'
              echo '```text'
              stat --printf='bytes=%s\n' .local/reference-data/sol-earth-reference.wforge
              sha256sum .local/reference-data/sol-earth-reference.wforge
              echo '```'
            fi
            echo
            echo 'Parchment starter generation is intentionally tested in the private Parchment-Worlds repository, where its repository-scoped token has access.'
            echo "Evidence artifact: \`ultra-earth-reference-evidence-${GITHUB_RUN_ID}\` (7-day retention)."
          } > "$summary"
          gh issue comment 124 --repo "$GITHUB_REPOSITORY" --body-file "$summary"

      - name: Enforce diagnostic result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.sol.outputs.status || '1' }}" != '0' ]]; then
            echo 'Ultra Earth Sol package build failed; inspect issue #124 and uploaded evidence.' >&2
            exit 1
          fi
