name: Stage Attribution and Projection 0.3.35 Runner

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-benchmark-verify-and-push:
    if: github.head_ref == 'automation/stage-attribution-biome-0.3.35-20260731'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Load runner files
        run: |
          git fetch origin automation/stage-attribution-biome-0.3.35-20260731
          git show FETCH_HEAD:scripts/automation-stage-attribution-biome-0.3.35.py > /tmp/automation-stage-attribution-biome-0.3.35.py
          git show FETCH_HEAD:scripts/benchmark-stage-attribution-biome-0.3.35.ts > scripts/.benchmark-stage-attribution-biome-0.3.35.ts

      - name: Install dependencies
        run: npm ci

      - name: Benchmark current dev
        run: npx tsx --tsconfig tsconfig.scripts.json scripts/.benchmark-stage-attribution-biome-0.3.35.ts > /tmp/stage-benchmark-before.json

      - name: Apply 0.3.35 slice
        run: python /tmp/automation-stage-attribution-biome-0.3.35.py

      - name: Run focused tests
        run: |
          npx vitest run \
            packages/generator-core/src/equirectangularTopologyLookup.test.ts \
            packages/generator-core/src/nativeStagePipeline.test.ts \
            packages/generator-core/src/generator.test.ts

      - name: Benchmark patched code
        run: npx tsx --tsconfig tsconfig.scripts.json scripts/.benchmark-stage-attribution-biome-0.3.35.ts > /tmp/stage-benchmark-after.json

      - name: Compare benchmark output
        run: |
          node <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('/tmp/stage-benchmark-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('/tmp/stage-benchmark-after.json', 'utf8'));
          const beforeOutput = JSON.stringify(before.output);
          const afterOutput = JSON.stringify(after.output);
          if (beforeOutput !== afterOutput) {
            throw new Error(`Generation output changed. before=${beforeOutput} after=${afterOutput}`);
          }
          const stageMap = (run) => Object.fromEntries(run.stages.map((stage) => [stage.label, Math.round(stage.elapsedMs)]));
          console.log(JSON.stringify({
            beforeWallMs: Math.round(before.wallMs),
            afterWallMs: Math.round(after.wallMs),
            changePercent: Number((((after.wallMs / before.wallMs) - 1) * 100).toFixed(1)),
            beforeStages: stageMap(before),
            afterStages: stageMap(after),
            beforePhases: before.phases,
            afterPhases: after.phases,
            output: after.output
          }, null, 2));
          if ((after.stages.find((stage) => stage.label === 'System and orbit')?.elapsedMs ?? Infinity) >=
              (after.stages.find((stage) => stage.label === 'Initial world foundation')?.elapsedMs ?? -Infinity)) {
            throw new Error('System and orbit is still swallowing the initial foundation stage.');
          }
          NODE

      - name: Verify repository
        run: npm run verify

      - name: Commit functional slice
        run: |
          git config user.name 'World Forge Automation'
          git config user.email 'actions@users.noreply.github.com'
          rm -f scripts/.benchmark-stage-attribution-biome-0.3.35.ts
          git add \
            apps/desktop/src/appVersion.ts \
            apps/desktop/src/release/ReleaseNotesModal.tsx \
            packages/generator-core/src/equirectangularTopologyLookup.ts \
            packages/generator-core/src/equirectangularTopologyLookup.test.ts \
            packages/generator-core/src/index.ts \
            packages/generator-core/src/deepTimePipeline.ts \
            packages/generator-core/src/biomeCohesion.ts \
            packages/generator-core/src/biomeDiagnostics.ts \
            packages/generator-core/src/nativeStagePipeline.ts \
            packages/generator-core/src/nativeStagePipeline.test.ts
          git commit -m 'Correct stage attribution and reuse projection lookups'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused browser QA
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/world-forge-vite.log 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function waitForServer(url, timeoutMs = 30000) {
            const started = Date.now();
            while (Date.now() - started < timeoutMs) {
              try {
                const response = await fetch(url);
                if (response.ok) return;
              } catch {}
              await wait(250);
            }
            throw new Error(`Server did not start: ${url}`);
          }
          function durationMs(text) {
            const value = text.trim();
            const minute = value.match(/^(\d+)m\s+(\d+)s$/);
            if (minute) return Number(minute[1]) * 60000 + Number(minute[2]) * 1000;
            if (value.endsWith(' ms')) return Number(value.replace(' ms', ''));
            if (value.endsWith(' s')) return Number(value.replace(' s', '')) * 1000;
            throw new Error(`Unknown duration: ${value}`);
          }
          (async () => {
            await waitForServer('http://127.0.0.1:5173');
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1920, height: 1080 } });
            const errors = [];
            page.on('pageerror', (error) => errors.push(error.message));
            await page.goto('http://127.0.0.1:5173', { waitUntil: 'networkidle' });
            const version = page.locator('.brand-version');
            await version.waitFor({ state: 'attached' });
            const versionText = (await version.textContent()) || '';
            if (!versionText.includes('0.3.35')) throw new Error(`Expected 0.3.35, got ${versionText}`);
            const quality = page.locator('#generation-quality');
            if (!(await quality.isVisible())) {
              const expandLeft = page.locator('.toolbar.panel-collapsed .panel-toggle').first();
              if (await expandLeft.isVisible()) await expandLeft.click();
            }
            await quality.waitFor({ state: 'visible', timeout: 10000 });
            await quality.selectOption('256x128');
            await page.locator('.advanced-generator-settings summary').click();
            await page.locator('#generation-workflow').selectOption('core.world-generation-experimental');
            await page.getByRole('button', { name: /^Generate$/ }).click();
            const summary = page.locator('.last-generation-summary');
            await summary.waitFor({ state: 'visible', timeout: 90000 });
            const entries = await summary.locator('.last-generation-stage-grid > span').evaluateAll((nodes) =>
              Object.fromEntries(nodes.map((node) => [
                node.querySelector('small')?.textContent || '',
                node.querySelector('output')?.textContent || ''
              ]))
            );
            if (!entries['Initial world foundation']) throw new Error(`Missing corrected stage label: ${JSON.stringify(entries)}`);
            const systemMs = durationMs(entries['System and orbit']);
            const foundationMs = durationMs(entries['Initial world foundation']);
            if (systemMs >= foundationMs) throw new Error(`System/orbit still owns foundation time: ${JSON.stringify(entries)}`);
            console.log('Browser stage summary', JSON.stringify(entries));
            for (const viewport of [{ width: 1440, height: 900 }, { width: 1920, height: 1080 }]) {
              await page.setViewportSize(viewport);
              await wait(100);
              const overflow = await page.evaluate(() => document.documentElement.scrollHeight > document.documentElement.clientHeight + 2);
              if (overflow) throw new Error(`Page-level vertical overflow at ${viewport.width}x${viewport.height}`);
            }
            if (errors.length) throw new Error(`Page errors: ${errors.join(' | ')}`);
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Push dev and remove runner branch
        run: |
          git push origin HEAD:dev
          git push origin --delete automation/stage-attribution-biome-0.3.35-20260731 || true
