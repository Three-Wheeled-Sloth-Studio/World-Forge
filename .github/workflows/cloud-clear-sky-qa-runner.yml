name: Temporary cloud clear-sky QA runner

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.head_ref == 'automation/cloud-clear-sky-qa-20260731'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Preserve temporary scripts
        run: |
          cp .github/scripts/apply-cloud-clear-sky-qa.py /tmp/apply-cloud-clear-sky-qa.py
          cp .github/scripts/qa-cloud-clear-sky.mjs /tmp/qa-cloud-clear-sky.mjs

      - name: Switch to exact accepted dev
        run: |
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "e265478b0bd40a7f9af2df6dd24500f050cda2e8"
          git checkout -B dev origin/dev

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Apply cloud clear-sky correction
        run: |
          python /tmp/apply-cloud-clear-sky-qa.py
          git diff --check
          grep -q "APP_VERSION = '0.3.42'" apps/desktop/src/appVersion.ts
          grep -q "sparse-layered-noise-v3" apps/desktop/src/globe/GlobeViewer.tsx
          grep -q "data-weather-shell-offset=\"0.002\"" apps/desktop/src/globe/GlobeViewer.tsx

      - name: Focused cloud texture tests
        run: npx vitest run src/globe/weatherPresentationTexture.test.ts

      - name: Full repository verification
        run: npm run verify

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Focused browser QA
        run: |
          mkdir -p .github/scripts
          cp /tmp/qa-cloud-clear-sky.mjs .github/scripts/qa-cloud-clear-sky.runtime.mjs
          npm run dev -- --host 127.0.0.1 > /tmp/world-forge-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then break; fi
            sleep 1
          done
          node .github/scripts/qa-cloud-clear-sky.runtime.mjs

      - name: Commit validated correction to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src refs/testing
          git diff --cached --check
          git commit -m "Restore clear-sky gaps in cloud rendering"
          git push origin HEAD:dev
          echo "Validated dev commit: $(git rev-parse HEAD)"

      - name: Delete disposable runner branch
        if: always()
        run: git push origin --delete automation/cloud-clear-sky-qa-20260731 || true
