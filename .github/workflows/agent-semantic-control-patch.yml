name: Apply Semantic Control Plumbing Patch

on:
  push:
    branches:
      - agent/bounded-three-era-aging
    paths:
      - .github/agent-semantic-control-patch.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/bounded-three-era-aging
          fetch-depth: 0

      - name: Apply exact source patches
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          foundation_path = Path('packages/generator-core/src/graph/run-generation-foundation.ts')
          foundation = foundation_path.read_text()
          foundation = replace_once(
              foundation,
              """function workflowNodes(workflowId: GenerationWorkflowId): readonly RegisteredNode[] {
            return workflowId === 'core.performance-foundation'
              ? performanceFoundationWorkflowNodes
              : liveWorkflowNodes;
          }
          """.replace('          ', ''),
              """function workflowNodes(workflowId: GenerationWorkflowId): readonly RegisteredNode[] {
            return generationWorkflowDescriptor(workflowId).seedStrategy === 'semantic-node'
              ? performanceFoundationWorkflowNodes
              : liveWorkflowNodes;
          }
          """.replace('          ', ''),
              'workflow seed routing'
          )
          foundation_path.write_text(foundation)

          generator_path = Path('apps/desktop/src/generator/GeneratorPanel.tsx')
          generator = generator_path.read_text()
          generator = replace_once(
              generator,
              "{generationWorkflowDescriptors.map((option) => (\n",
              "{generationWorkflowDescriptors.filter((option) => option.selectableInGenerator).map((option) => (\n",
              'generator workflow visibility'
          )
          generator_path.write_text(generator)

          benchmark_path = Path('scripts/compare-generation-workflows.ts')
          benchmark = benchmark_path.read_text()
          benchmark = replace_once(
              benchmark,
              "  generationWorkflowDescriptor,\n  generationWorkflowIds,\n",
              "  generationWorkflowDescriptor,\n",
              'benchmark import'
          )
          benchmark = replace_once(
              benchmark,
              "  const workflowValues = split(value('workflows')) ?? [...generationWorkflowIds];\n",
              "  const workflowValues = split(value('workflows')) ?? ['core.live-world', 'core.performance-foundation'];\n",
              'benchmark defaults'
          )
          benchmark_path.write_text(benchmark)
          PY

      - name: Remove temporary patch harness
        run: rm .github/workflows/agent-semantic-control-patch.yml .github/agent-semantic-control-patch.trigger

      - name: Commit patched sources
        run: |
          git config user.name "world-forge-agent"
          git config user.email "actions@users.noreply.github.com"
          git add packages/generator-core/src/graph/run-generation-foundation.ts apps/desktop/src/generator/GeneratorPanel.tsx scripts/compare-generation-workflows.ts .github
          git commit -m "Add semantic seed comparison control"
          git push origin HEAD:agent/bounded-three-era-aging
