name: Profile current generation

on:
  push:
    branches:
      - agent/promote-polar-profile-performance-bottlenecks
    paths:
      - .github/workflows/profile-current-generation.yml
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out profiling branch
        uses: actions/checkout@v5
        with:
          ref: agent/promote-polar-profile-performance-bottlenecks
      - name: Resolve checked-out source commit
        shell: bash
        run: echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Profile standard matrix
        run: npm run profile:generation -- --workflow=core.performance-foundation --resolution=512x256 --seeds=1001001,3141592,8675309 --scenarios=earthlike-standard,archipelago-standard,geology-glacial-stress --runs=1 --source-commit=${SOURCE_COMMIT}
      - name: Profile production scaling probe
        run: npm run profile:generation -- --workflow=core.performance-foundation --resolution=1024x512 --seeds=1001001,3141592 --scenarios=earthlike-standard --runs=1 --source-commit=${SOURCE_COMMIT}
      - name: Normalize evidence paths
        shell: bash
        run: |
          set -euo pipefail
          standard_json=$(ls -1t refs/testing/current-generation-profile-512x256-*.json | head -1)
          standard_md=$(ls -1t refs/testing/current-generation-profile-512x256-*.md | head -1)
          scaling_json=$(ls -1t refs/testing/current-generation-profile-1024x512-*.json | head -1)
          scaling_md=$(ls -1t refs/testing/current-generation-profile-1024x512-*.md | head -1)
          mv "$standard_json" refs/testing/current-generation-profile-512x256.json
          mv "$standard_md" refs/testing/current-generation-profile-512x256.md
          mv "$scaling_json" refs/testing/current-generation-profile-1024x512.json
          mv "$scaling_md" refs/testing/current-generation-profile-1024x512.md
      - name: Upload profiling reports
        uses: actions/upload-artifact@v4
        with:
          name: current-generation-profiles
          path: |
            refs/testing/current-generation-profile-512x256.json
            refs/testing/current-generation-profile-512x256.md
            refs/testing/current-generation-profile-1024x512.json
            refs/testing/current-generation-profile-1024x512.md
          if-no-files-found: error
          retention-days: 7
      - name: Commit profiling evidence
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refs/testing/current-generation-profile-512x256.json refs/testing/current-generation-profile-512x256.md refs/testing/current-generation-profile-1024x512.json refs/testing/current-generation-profile-1024x512.md
          git commit -m "Record current generation bottleneck profile"
          git push origin HEAD:agent/promote-polar-profile-performance-bottlenecks
