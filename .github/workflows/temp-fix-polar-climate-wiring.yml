name: Temporary fix polar climate wiring

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/polar-climate-foundation-profiling'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply wiring fixes
        run: python scripts/temp-fix-polar-climate-wiring.py

      - name: Remove temporary runner
        run: |
          rm scripts/temp-fix-polar-climate-wiring.py
          rm .github/workflows/temp-fix-polar-climate-wiring.yml

      - name: Commit fixes
        run: |
          git config user.name "World Forge Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix polar climate integration wiring"
          git push origin HEAD:${{ github.head_ref }}
