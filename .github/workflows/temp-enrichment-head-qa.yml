name: Temporary enrichment branch cleanup

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  delete-runner-branches:
    if: github.head_ref == 'automation/enrichment-head-qa-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Delete disposable branches
        run: |
          git push origin --delete automation/enrichment-foundation-20260731 || true
          git push origin --delete automation/enrichment-head-qa-20260731
