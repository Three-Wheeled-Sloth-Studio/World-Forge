name: Temporary camera-orbit correction runner

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.head_ref == 'automation/camera-orbit-correction-20260731-r3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Preserve temporary scripts
        run: |
          cp .github/scripts/apply-camera-orbit-correction.py /tmp/apply-camera-orbit-correction.py
          cp .github/scripts/qa-camera-orbit-correction.mjs /tmp/qa-camera-orbit-correction.mjs

      - name: Switch to exact accepted dev
        run: |
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "e7fbd0799a65dba8c874489de46907e45b7b6484"
          git checkout -B dev origin/dev

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Apply camera-orbit correction
        run: |
          python /tmp/apply-camera-orbit-correction.py
          git diff --check
          grep -q "APP_VERSION = '0.3.39'" apps/desktop/src/appVersion.ts
          grep -q "fixed-world-camera-orbit" apps/desktop/src/globe/GlobeViewer.tsx
          grep -q "observerControl = 'camera-orbit'" apps/desktop/src/globe/GlobeViewer.tsx
          ! grep -q "manualSpinOffset" apps/desktop/src/globe/GlobeViewer.tsx

      - name: Full repository verification
        run: npm run verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Focused browser QA
        run: |
          mkdir -p .github/scripts
          cp /tmp/qa-camera-orbit-correction.mjs .github/scripts/qa-camera-orbit-correction.runtime.mjs
          npm run dev -- --host 127.0.0.1 > /tmp/world-forge-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then break; fi
            sleep 1
          done
          node .github/scripts/qa-camera-orbit-correction.runtime.mjs

      - name: Commit validated correction to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src refs/handoffs refs/testing
          git diff --cached --check
          git commit -m "Orbit camera around fixed globe system"
          git push origin HEAD:dev
          echo "Validated dev commit: $(git rev-parse HEAD)"

      - name: Delete disposable runner branch
        if: always()
        run: git push origin --delete automation/camera-orbit-correction-20260731-r3 || true
