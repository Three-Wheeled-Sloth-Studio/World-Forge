name: Explore Toolbar Disclosure Runner

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Load automation script
        shell: bash
        run: |
          git fetch origin "$GITHUB_HEAD_REF"
          git show FETCH_HEAD:scripts/automation-explore-toolbar-disclosure.py > /tmp/automation-explore-toolbar-disclosure.py

      - name: Install dependencies
        run: npm ci

      - name: Apply Explore toolbar disclosure
        run: python /tmp/automation-explore-toolbar-disclosure.py patch

      - name: Verify repository
        run: npm run verify 2>&1 | tee /tmp/world-forge-verify.log

      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium

      - name: Run focused browser QA
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/world-forge-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          try {
            for (const viewport of [{ width: 1920, height: 1080 }, { width: 1440, height: 900 }]) {
              const context = await browser.newContext({ viewport });
              const page = await context.newPage();
              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });

              const build = page.getByRole('tab', { name: 'Build', exact: true });
              const explore = page.getByRole('tab', { name: 'Explore', exact: true });
              const exportMode = page.getByRole('tab', { name: 'Export', exact: true });
              if (await build.getAttribute('aria-selected') !== 'true') throw new Error('Build was not selected for an empty workspace');

              await page.locator('.canvas-wrap').evaluate((element) => { element.dataset.qaMarker = 'preserved'; });
              await explore.click();
              if (await explore.getAttribute('aria-selected') !== 'true') throw new Error('Explore did not become selected');

              for (const label of ['Map view', 'Globe view', 'Presentation', 'Map subject', 'Enable point inspector', 'Fit view', 'Layers and display options']) {
                const target = page.getByLabel(label, { exact: true });
                if (!(await target.isVisible())) throw new Error(`${label} was not immediately visible in Explore`);
              }

              const rivers = page.getByRole('button', { name: /^Rivers/ });
              if (await rivers.isVisible()) throw new Error('Rivers escaped the closed Layers disclosure');
              await page.getByLabel('Layers and display options', { exact: true }).click();
              if (!(await rivers.isVisible())) throw new Error('Rivers were not available in Layers');
              if (!(await page.getByRole('button', { name: /^Plate boundaries/ }).isVisible())) throw new Error('Plate boundaries were not available in Layers');
              if (!(await page.getByRole('button', { name: /^Hex overlay/ }).isVisible())) throw new Error('Hex overlay was not available in Layers');
              if (!(await page.getByLabel('Coastline treatment', { exact: true }).isVisible())) throw new Error('Coastline treatment was not available in Layers');
              if (!(await page.getByLabel('Preview resolution', { exact: true }).isVisible())) throw new Error('Preview resolution was not available in Layers');

              const initialRiverState = await rivers.getAttribute('aria-pressed');
              await rivers.click();
              if (await rivers.getAttribute('aria-pressed') === initialRiverState) throw new Error('River layer did not toggle');

              await page.getByLabel('Globe view', { exact: true }).click();
              const shells = page.getByRole('button', { name: /^Ocean and atmosphere/ });
              if (!(await shells.isVisible())) throw new Error('Globe shells were not available in Layers for globe view');

              const zoomButton = page.getByRole('button', { name: /Zoom 100 percent/ });
              await zoomButton.click();
              await page.getByRole('menuitem', { name: '150%' }).click();
              if (!(await page.getByRole('button', { name: /Zoom 150 percent/ }).isVisible())) throw new Error('Normal-click zoom menu did not change zoom');
              await page.getByLabel('Fit view', { exact: true }).click();
              if (!(await page.getByRole('button', { name: /Zoom 100 percent/ }).isVisible())) throw new Error('Fit did not reset zoom to 100 percent');

              for (const [label, tab] of [['Export', exportMode], ['Build', build], ['Explore', explore]]) {
                await tab.click();
                if (await tab.getAttribute('aria-selected') !== 'true') throw new Error(`${label} did not become selected`);
                const marker = await page.locator('.canvas-wrap').getAttribute('data-qa-marker');
                if (marker !== 'preserved') throw new Error(`Canvas workspace remounted while switching to ${label}`);
              }

              const layout = await page.evaluate(() => ({
                scrollHeight: document.documentElement.scrollHeight,
                bodyScrollHeight: document.body.scrollHeight,
                innerHeight: window.innerHeight
              }));
              if (layout.scrollHeight > layout.innerHeight + 1 || layout.bodyScrollHeight > layout.innerHeight + 1) {
                throw new Error(`Page-level vertical scroll at ${viewport.width}x${viewport.height}: ${JSON.stringify(layout)}`);
              }
              await context.close();
            }
          } finally {
            await browser.close();
          }
          JS

      - name: Commit functional increment
        shell: bash
        run: |
          git config user.name 'World Forge Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/desktop/src/workspace/WorldWorkspace.tsx \
            apps/desktop/src/workspace/workspaceToolbar.css \
            apps/desktop/src/appVersion.ts \
            apps/desktop/src/release/ReleaseNotesModal.tsx
          git commit -m 'Simplify Explore toolbar disclosure'
          git rev-parse HEAD > /tmp/world-forge-functional-sha

      - name: Update cleanup handoff
        shell: bash
        run: |
          python /tmp/automation-explore-toolbar-disclosure.py handoff
          git add refs/handoffs/world-builder-cleanup.md
          git commit -m 'Update world builder cleanup handoff'

      - name: Push dev and remove runner branch
        shell: bash
        run: |
          git push origin HEAD:dev
          git push origin --delete automation/explore-toolbar-disclosure-20260730 || true
