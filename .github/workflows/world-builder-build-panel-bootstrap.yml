name: World Builder Build Panel Bootstrap

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'automation/world-builder-build-panel-20260730'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Fetch one-time scripts
        shell: bash
        run: |
          git fetch origin automation/world-builder-build-panel-20260730
          git show FETCH_HEAD:scripts/apply-world-builder-build-panel.py > /tmp/apply-world-builder-build-panel.py
          git show FETCH_HEAD:scripts/update-world-builder-build-panel-handoff.py > /tmp/update-world-builder-build-panel-handoff.py

      - name: Apply build panel slice
        shell: bash
        run: python /tmp/apply-world-builder-build-panel.py

      - name: Install dependencies
        run: npm ci

      - name: Verify
        shell: bash
        run: npm run verify 2>&1 | tee /tmp/world-forge-verify.log

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Focused browser QA
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/world-forge-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          try {
            for (const viewport of [{ width: 1920, height: 1080 }, { width: 1440, height: 900 }]) {
              const context = await browser.newContext({ viewport });
              const page = await context.newPage();
              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });

              const build = page.getByRole('tab', { name: 'Build', exact: true });
              const explore = page.getByRole('tab', { name: 'Explore', exact: true });
              const exportMode = page.getByRole('tab', { name: 'Export', exact: true });
              if (await build.getAttribute('aria-selected') !== 'true') throw new Error('Build was not selected for an empty workspace');

              const generator = page.locator('.generator-panel');
              await generator.getByRole('heading', { name: 'Quick build', exact: true }).waitFor();
              await generator.getByLabel('Generation quality').waitFor();
              if (await generator.getByRole('button', { name: 'Generate', exact: true }).count() !== 1) throw new Error('Generate action missing');
              if (await generator.locator('.profile-pill').count() !== 0) throw new Error('Account pill remains inside Build');

              await generator.locator('details.advanced-generator-settings').evaluate((details) => { details.open = true; });
              for (const heading of ['World shape', 'Climate', 'Geology and history', 'Hydrology', 'System']) {
                await generator.getByRole('heading', { name: heading, exact: true }).waitFor();
              }
              await generator.getByText('Continent count', { exact: true }).waitFor();
              await generator.getByText('Continent size and cohesion', { exact: true }).waitFor();
              if (await generator.getByText('Regions', { exact: true }).count() !== 0) throw new Error('Old Regions label remains');
              if (await generator.getByText('Continents', { exact: true }).count() !== 0) throw new Error('Old Continents label remains');

              await page.locator('.canvas-wrap').evaluate((element) => { element.dataset.qaMarker = 'preserved'; });
              await explore.click();
              await page.getByLabel('Preview resolution').waitFor();
              if (await page.getByLabel('PNG export resolution').count() !== 0) throw new Error('PNG resolution leaked into Explore');
              if (await page.locator('.canvas-wrap').getAttribute('data-qa-marker') !== 'preserved') throw new Error('Canvas remounted in Explore');

              await exportMode.click();
              await page.getByLabel('PNG export resolution').waitFor();
              if (await page.getByLabel('Preview resolution').count() !== 0) throw new Error('Preview resolution leaked into Export');
              if (await page.locator('.canvas-wrap').getAttribute('data-qa-marker') !== 'preserved') throw new Error('Canvas remounted in Export');

              await build.click();
              if (await page.locator('.canvas-wrap').getAttribute('data-qa-marker') !== 'preserved') throw new Error('Canvas remounted on return to Build');

              const layout = await page.evaluate(() => ({
                documentScrollHeight: document.documentElement.scrollHeight,
                bodyScrollHeight: document.body.scrollHeight,
                innerHeight: window.innerHeight
              }));
              if (layout.documentScrollHeight > layout.innerHeight + 1 || layout.bodyScrollHeight > layout.innerHeight + 1) {
                throw new Error(`Page-level vertical scroll at ${viewport.width}x${viewport.height}: ${JSON.stringify(layout)}`);
              }
              await context.close();
            }
          } finally {
            await browser.close();
          }
          JS

      - name: Commit functional increment
        shell: bash
        run: |
          git config user.name 'World Forge Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            apps/desktop/src/main.tsx \
            apps/desktop/src/appVersion.ts \
            apps/desktop/src/release/ReleaseNotesModal.tsx \
            apps/desktop/src/generator/GeneratorPanel.tsx \
            apps/desktop/src/generator/generatorPanel.css \
            apps/desktop/src/generator/generationParameterControls.ts \
            apps/desktop/src/generator/generationParameterControls.test.ts \
            apps/desktop/src/workspace/WorldWorkspace.tsx \
            apps/desktop/src/workspace/workspaceToolbar.css
          git commit -m 'Recompose the world Build panel'
          git rev-parse HEAD > /tmp/world-forge-functional-sha

      - name: Update cleanup handoff
        shell: bash
        run: |
          python /tmp/update-world-builder-build-panel-handoff.py "$(cat /tmp/world-forge-functional-sha)" /tmp/world-forge-verify.log
          git add refs/handoffs/world-builder-cleanup.md
          git commit -m 'Update world builder cleanup handoff'

      - name: Push dev and remove runner branch
        shell: bash
        run: |
          git push origin HEAD:dev
          git push origin --delete automation/world-builder-build-panel-20260730
