name: Benchmark Bounded Three-Era Aging

on:
  push:
    branches:
      - agent/bounded-three-era-aging
    paths:
      - .github/agent-pr19-benchmark.trigger

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/bounded-three-era-aging
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run full workflow comparison
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: npm run benchmark:workflows -- --seeds=1001001,3141592,8675309 --scenarios=earthlike-standard,archipelago-standard,geology-glacial-stress --resolution=512x256 --runs=1

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: bounded-three-era-aging-benchmark
          path: |
            refs/testing/generation-workflow-comparison-*.json
            refs/testing/generation-workflow-comparison-*.md
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary benchmark harness
        run: rm .github/workflows/agent-pr19-benchmark.yml .github/agent-pr19-benchmark.trigger

      - name: Commit harness cleanup
        run: |
          git config user.name "world-forge-agent"
          git config user.email "actions@users.noreply.github.com"
          git add .github
          git commit -m "Remove temporary bounded aging benchmark harness"
          git push origin HEAD:agent/bounded-three-era-aging
