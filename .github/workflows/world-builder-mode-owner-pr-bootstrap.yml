name: World Builder Mode Ownership PR Bootstrap

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Execute one-time runner
        shell: bash
        run: |
          git fetch origin automation/world-builder-mode-owner-20260730
          git show FETCH_HEAD:.github/workflows/world-builder-mode-owner-runner.yml > /tmp/world-builder-mode-owner-runner.yml
          python <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          def run_shell(block: str, label: str) -> None:
              print(label, flush=True)
              subprocess.run(['bash', '-euo', 'pipefail', '-c', block], check=True)

          text = Path('/tmp/world-builder-mode-owner-runner.yml').read_text()
          blocks = []
          lines = text.splitlines()
          index = 0
          while index < len(lines):
              if re.match(r'^\s{8}run: \|$', lines[index]):
                  index += 1
                  block = []
                  while index < len(lines):
                      line = lines[index]
                      if line and len(line) - len(line.lstrip()) <= 8:
                          break
                      block.append(line[10:] if line.startswith('          ') else line)
                      index += 1
                  blocks.append(textwrap.dedent('\n'.join(block)))
                  continue
              index += 1

          if len(blocks) != 5:
              raise RuntimeError(f'Expected 5 multiline runner blocks, found {len(blocks)}')

          run_shell('npm ci', 'Installing dependencies')
          run_shell(blocks[0], 'Applying workspace mode ownership changes')
          run_shell('npm run verify 2>&1 | tee /tmp/world-forge-verify.log', 'Running repository verification')
          run_shell('npx playwright install --with-deps chromium', 'Installing Chromium for browser QA')
          run_shell(blocks[1], 'Running focused browser QA')
          run_shell(blocks[2], 'Committing functional increment')
          run_shell(blocks[3], 'Updating cleanup handoff')
          run_shell(blocks[4], 'Pushing dev and removing runner branch')
          PY
