name: Benchmark Generation Performance Sample

on:
  push:
    branches:
      - benchmark/generation-performance-sample

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run bounded workflow comparison
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: npm run benchmark:workflows -- --seeds=1001001 --scenarios=earthlike-standard,archipelago-standard,geology-glacial-stress --resolution=512x256 --runs=1

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: generation-performance-sample
          path: |
            refs/testing/generation-workflow-comparison-*.json
            refs/testing/generation-workflow-comparison-*.md
          if-no-files-found: error
          retention-days: 14
