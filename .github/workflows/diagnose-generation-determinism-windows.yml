name: Diagnose generation determinism on Windows

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/diagnose-generation-determinism-windows.yml'
      - 'packages/generator-core/src/generator.test.ts'
      - 'packages/generator-core/src/generatorDeterminismRegression.test.ts'

permissions:
  contents: read

jobs:
  determinism:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test -- --reporter=verbose
