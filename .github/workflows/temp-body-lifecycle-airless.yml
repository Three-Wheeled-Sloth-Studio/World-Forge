name: Temporary body lifecycle and airless-moon runner

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.head_ref == 'automation/body-lifecycle-airless-20260731'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Preserve staged product and validation files
        run: |
          mkdir -p /tmp/body-slice
          cat .github/scripts/body-slice.tar.gz.b64.part-* | base64 -d | tar -xz -C /tmp/body-slice

      - name: Switch to exact accepted dev
        run: |
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "7dfbc4af4c743d84216f4849292ad787311c284a"
          git checkout -B dev origin/dev

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Apply body lifecycle and airless-moon boundary
        run: |
          cp /tmp/body-slice/packages/generation-runtime/src/enrichment/* packages/generation-runtime/src/enrichment/
          cp /tmp/body-slice/apps/desktop/src/enrichment/* apps/desktop/src/enrichment/
          cp /tmp/body-slice/apps/desktop/src/system/* apps/desktop/src/system/
          cp /tmp/body-slice/refs/testing/body-generation-visual-qa.md refs/testing/body-generation-visual-qa.md
          python /tmp/body-slice/.github/scripts/apply-body-generation-boundary.py
          git diff --check
          grep -q "APP_VERSION = '0.3.45'" apps/desktop/src/appVersion.ts
          grep -q "body-generation-lifecycle-v1" packages/shared/src/index.ts
          grep -q "project.generate-airless-rocky-body" packages/generation-runtime/src/enrichment/airlessRockyBody.ts
          grep -q "useBodyGenerationQueue" apps/desktop/src/main.tsx
          grep -q "data-selected-body-material" apps/desktop/src/system/SystemViewer.tsx
          grep -q "System camera panning remains a backlog item" refs/handoffs/system-visualization-enrichment.md

      - name: Focused lifecycle and body-generation tests
        run: npx vitest run packages/generation-runtime/src/enrichment/airlessRockyBody.test.ts packages/generation-runtime/src/enrichment/bodyGenerationLifecycle.test.ts apps/desktop/src/system/systemPresentation.test.ts

      - name: Full repository verification
        run: npm run verify

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Focused Chromium QA
        run: |
          mkdir -p .github/scripts
          cp /tmp/body-slice/.github/scripts/qa-body-generation.mjs .github/scripts/qa-body-generation.runtime.mjs
          npm run dev -- --host 127.0.0.1 > /tmp/world-forge-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then break; fi
            sleep 1
          done
          node .github/scripts/qa-body-generation.runtime.mjs || {
            cat /tmp/world-forge-vite.log
            exit 1
          }

      - name: Commit body lifecycle and generated-body runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared/src/index.ts packages/generation-runtime/src/enrichment apps/desktop/src/enrichmentWorker.ts
          git diff --cached --check
          git commit -m "Add body lifecycle and airless moon workflow"

      - name: Commit System queue and generated-body presentation
        run: |
          git add apps/desktop/src
          git diff --cached --check
          git commit -m "Add System body queue and moon presentation"

      - name: Commit body-generation planning and QA references
        run: |
          git add refs/planning/pi-system-visualization-and-progressive-body-enrichment.md refs/handoffs/system-visualization-enrichment.md refs/testing/body-generation-visual-qa.md
          git diff --cached --check
          git commit -m "Document airless moon proof boundary"

      - name: Push validated commits directly to dev
        run: |
          git push origin HEAD:dev
          echo "Validated dev commit: $(git rev-parse HEAD)"

      - name: Delete disposable runner branch
        if: always()
        run: git push origin --delete automation/body-lifecycle-airless-20260731 || true
