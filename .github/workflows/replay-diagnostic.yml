name: Replay validation diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Capture full verification output
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          npm run verify > replay-validation.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload verification log
        uses: actions/upload-artifact@v4
        with:
          name: replay-validation-log
          path: replay-validation.log

      - name: Preserve validation result
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
