name: Issue 14 Experimental Climate Runner

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/issue-14-experimental-climate-runner.yml'
      - 'scripts/automation-issue-14-experimental-climate.py'

permissions:
  contents: write

jobs:
  apply-benchmark-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Load automation script
        run: |
          git fetch origin automation/issue-14-experimental-climate-20260731
          git show FETCH_HEAD:scripts/automation-issue-14-experimental-climate.py > /tmp/automation-issue-14-experimental-climate.py
      - name: Install dependencies
        run: npm ci
      - name: Apply Experimental climate traversal optimization
        run: python /tmp/automation-issue-14-experimental-climate.py apply
      - name: Run focused contract tests
        run: >-
          npx vitest run
          packages/generator-core/src/presentClimateTraversal.test.ts
          packages/generator-core/src/workflows.test.ts
          packages/generation-runtime/src/graph/generationWorkflows.test.ts
      - name: Verify repository
        run: npm run verify
      - name: Commit functional increment
        run: |
          git config user.name 'World Forge Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            packages/generator-core/src/presentClimateTraversal.ts \
            packages/generator-core/src/presentClimateTraversal.test.ts \
            packages/generator-core/src/workflows.ts \
            packages/generator-core/src/workflows.test.ts \
            packages/generator-core/src/deepTimePipeline.ts \
            packages/generation-runtime/src/graph/generationWorkflows.ts \
            packages/generation-runtime/src/graph/generationWorkflows.test.ts
          git commit -m 'Optimize Experimental present-climate traversal'
          git rev-parse HEAD > /tmp/world-forge-functional-sha
      - name: Run nine-pair Detailed versus Experimental benchmark
        run: |
          SOURCE_COMMIT=$(cat /tmp/world-forge-functional-sha)
          npm run benchmark:workflows -- \
            --workflows=core.performance-foundation,core.world-generation-experimental \
            --seeds=1001001,3141592,8675309 \
            --scenarios=earthlike-standard,archipelago-standard,geology-glacial-stress \
            --resolution=512x256 \
            --runs=1 \
            --source-commit="$SOURCE_COMMIT"
      - name: Enforce benchmark gates and write evidence
        run: python /tmp/automation-issue-14-experimental-climate.py evidence
      - name: Commit benchmark evidence
        run: |
          git add \
            refs/planning/pi-generation-performance-foundation.md \
            refs/testing/present-climate-topology-traversal-benchmark.json \
            refs/testing/present-climate-topology-traversal-benchmark.md \
            refs/testing/present-climate-topology-traversal-summary.json
          git commit -m 'Record Experimental climate traversal benchmark'
      - name: Push dev and remove runner branches
        run: |
          git push origin HEAD:dev
          git push origin --delete automation/issue-14-experimental-climate-20260731 || true
          git push origin --delete automation/issue-14-experimental-profile-20260731 || true
