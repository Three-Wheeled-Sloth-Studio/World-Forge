name: Persist current generation profile

on:
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/persist-current-generation-profile.yml

permissions:
  actions: read
  contents: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out profiling branch
        uses: actions/checkout@v5
        with:
          ref: agent/promote-polar-profile-performance-bottlenecks
      - name: Download successful profiling artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 30754236664 --repo Three-Wheeled-Sloth-Studio/World-Forge --name current-generation-profiles --dir /tmp/current-generation-profiles
      - name: Copy evidence into repository
        run: |
          set -euo pipefail
          cp /tmp/current-generation-profiles/current-generation-profile-512x256.json refs/testing/current-generation-profile-512x256.json
          cp /tmp/current-generation-profiles/current-generation-profile-512x256.md refs/testing/current-generation-profile-512x256.md
          cp /tmp/current-generation-profiles/current-generation-profile-1024x512.json refs/testing/current-generation-profile-1024x512.json
          cp /tmp/current-generation-profiles/current-generation-profile-1024x512.md refs/testing/current-generation-profile-1024x512.md
      - name: Commit exact evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refs/testing/current-generation-profile-512x256.json refs/testing/current-generation-profile-512x256.md refs/testing/current-generation-profile-1024x512.json refs/testing/current-generation-profile-1024x512.md
          git commit -m "Persist corrected current generation profile"
          git pull --rebase origin agent/promote-polar-profile-performance-bottlenecks
          git push origin HEAD:agent/promote-polar-profile-performance-bottlenecks
