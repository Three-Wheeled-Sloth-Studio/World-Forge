name: Generation Timing 0.3.34 Runner

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-verify-and-push:
    if: github.head_ref == 'automation/generation-timing-0.3.34-20260731'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Load automation scripts
        run: |
          git fetch origin automation/generation-timing-0.3.34-20260731
          git show FETCH_HEAD:scripts/automation-generation-timing-0.3.34.py > /tmp/automation-generation-timing-0.3.34.py
          git show FETCH_HEAD:scripts/automation-generation-timing-0.3.34-fix.py > /tmp/automation-generation-timing-0.3.34-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Apply timing slice
        run: |
          python /tmp/automation-generation-timing-0.3.34.py
          python /tmp/automation-generation-timing-0.3.34-fix.py

      - name: Run focused timing tests
        run: npx vitest run apps/desktop/src/generation/generationTiming.test.ts

      - name: Verify repository
        run: npm run verify

      - name: Commit functional slice
        run: |
          git config user.name 'World Forge Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            apps/desktop/src/appVersion.ts \
            apps/desktop/src/release/ReleaseNotesModal.tsx \
            apps/desktop/src/generation/generationEvents.ts \
            apps/desktop/src/generation/generationTiming.ts \
            apps/desktop/src/generation/generationTiming.test.ts \
            apps/desktop/src/generation/useGenerationWorkflow.ts \
            apps/desktop/src/generationWorker.ts \
            apps/desktop/src/generator/GeneratorPanel.tsx \
            apps/desktop/src/generator/generatorPanel.css \
            apps/desktop/src/workspace/WorldWorkspace.tsx \
            apps/desktop/src/workspace/workspaceToolbar.css \
            apps/desktop/src/main.tsx
          git commit -m 'Expose generation timing and advance to 0.3.34'
          git rev-parse HEAD > /tmp/world-forge-functional-sha

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused browser QA
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/world-forge-vite.log 2>&1 &
          echo $! > /tmp/world-forge-vite.pid
          node <<'NODE'
          const { chromium } = require('playwright');

          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function waitForServer(url, timeoutMs = 30000) {
            const started = Date.now();
            while (Date.now() - started < timeoutMs) {
              try {
                const response = await fetch(url);
                if (response.ok) return;
              } catch {}
              await wait(250);
            }
            throw new Error(`Server did not start: ${url}`);
          }

          (async () => {
            await waitForServer('http://127.0.0.1:5173');
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const errors = [];
            page.on('pageerror', (error) => errors.push(error.message));
            await page.goto('http://127.0.0.1:5173', { waitUntil: 'networkidle' });

            const version = page.locator('.brand-version');
            await version.waitFor({ state: 'visible' });
            const versionText = (await version.textContent()) || '';
            if (!versionText.includes('0.3.34')) throw new Error(`Expected visible 0.3.34, got ${versionText}`);

            await page.locator('#generation-quality').selectOption('256x128');
            await page.locator('.advanced-generator-settings summary').click();
            await page.locator('#generation-workflow').selectOption('core.world-generation-experimental');
            await page.getByRole('button', { name: /^Generate$/ }).click();

            const buildLive = page.locator('.build-generation-progress-copy small');
            await buildLive.waitFor({ state: 'visible', timeout: 15000 });
            const buildLiveText = (await buildLive.textContent()) || '';
            if (!/Total .*Stage /.test(buildLiveText)) throw new Error(`Missing Build live timings: ${buildLiveText}`);

            const canvasLive = page.locator('.generation-progress-copy small');
            await canvasLive.waitFor({ state: 'visible', timeout: 15000 });
            const canvasLiveText = (await canvasLive.textContent()) || '';
            if (!/Total .*Stage /.test(canvasLiveText)) throw new Error(`Missing canvas live timings: ${canvasLiveText}`);

            const summary = page.locator('.last-generation-summary');
            await summary.waitFor({ state: 'visible', timeout: 90000 });
            const summaryText = (await summary.textContent()) || '';
            for (const required of ['World Generation (Experimental) v0.2.0', 'Total wall time', 'Slowest stage']) {
              if (!summaryText.includes(required)) throw new Error(`Missing last-run summary text: ${required}`);
            }
            const stageCount = await summary.locator('.last-generation-stage-grid > span').count();
            if (stageCount < 8) throw new Error(`Expected at least 8 native stage timings, got ${stageCount}`);
            const completedAt = await summary.locator('time').getAttribute('datetime');
            if (!completedAt || Number.isNaN(Date.parse(completedAt))) throw new Error(`Invalid completion timestamp: ${completedAt}`);

            for (const viewport of [{ width: 1440, height: 900 }, { width: 1920, height: 1080 }]) {
              await page.setViewportSize(viewport);
              await wait(100);
              const overflow = await page.evaluate(() => document.documentElement.scrollHeight > document.documentElement.clientHeight + 2);
              if (overflow) throw new Error(`Page-level vertical overflow at ${viewport.width}x${viewport.height}`);
            }

            if (errors.length) throw new Error(`Page errors: ${errors.join(' | ')}`);
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Push dev and remove runner branch
        run: |
          git push origin HEAD:dev
          git push origin --delete automation/generation-timing-0.3.34-20260731 || true
