name: Ultra Earth Acceptance Verification

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/ultra-earth-acceptance.yml'
      - '.github/workflows/ultra-earth-reference.yml'
      - 'package.json'
      - 'scripts/build-maintained-sol-reference.ts'
      - 'scripts/maintained-sol-command.test.ts'
      - 'scripts/build-sol-reference-pipeline.ts'
      - 'scripts/build-sol-reference-pipeline.test.ts'
      - 'apps/desktop/src/appVersion.ts'
      - 'apps/desktop/src/globe/**'
      - 'apps/desktop/src/shell/parchmentNavigation.ts'
      - 'apps/desktop/src/shell/parchmentNavigation.test.ts'

concurrency:
  group: ultra-earth-acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Announce acceptance run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 124 --repo "$GITHUB_REPOSITORY" --body "Ultra Earth acceptance verification [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) started for commit \`${GITHUB_SHA}\`."

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run focused Ultra regressions
        run: npx vitest run apps/desktop/src/globe/globeTextureResolution.test.ts apps/desktop/src/shell/parchmentNavigation.test.ts scripts/maintained-sol-command.test.ts scripts/build-sol-reference-pipeline.test.ts scripts/publish-sol-starter.test.ts

      - name: Run repository verification
        run: npm run verify

      - name: Report acceptance result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${{ job.status }}" == 'success' ]]; then
            result='passed'
          else
            result='failed'
          fi
          gh issue comment 124 --repo "$GITHUB_REPOSITORY" --body "Ultra Earth acceptance verification [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) ${result} for commit \`${GITHUB_SHA}\`. Focused Ultra regressions, canonical Sol-build orchestration, and \`npm run verify\` were included."
