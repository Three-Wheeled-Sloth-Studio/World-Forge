name: Temporary integrate polar profile through deep time

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/polar-climate-foundation-profiling'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply deep-time integration
        run: python scripts/temp-integrate-polar-profile-through-deep-time.py

      - name: Remove temporary runner
        run: |
          rm scripts/temp-integrate-polar-profile-through-deep-time.py
          rm .github/workflows/temp-integrate-polar-profile-through-deep-time.yml

      - name: Commit integration
        run: |
          git config user.name "World Forge Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Carry Experimental polar profile through deep time"
          git push origin HEAD:${{ github.head_ref }}
