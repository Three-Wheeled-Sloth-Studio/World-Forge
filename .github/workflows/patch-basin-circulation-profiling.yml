name: Patch basin circulation profiling

on:
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/patch-basin-circulation-profiling.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out profiling branch
        uses: actions/checkout@v5
        with:
          ref: agent/promote-polar-profile-performance-bottlenecks
      - name: Add internal basin timers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one {label}, found {count}')
              return text.replace(old, new, 1)

          path = Path('packages/generator-core/src/basinCirculation.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "import { clamp, type WorldProject } from '@world-forge/shared';",
              "import { clamp, type WorldProject } from '@world-forge/shared';\nimport { traceGenerationPerformance } from './generationPerformanceTrace';",
              'basin circulation import'
          )
          text = replace_once(
              text,
              "  const { ids: basinIds, basins } = labelBasins(layers.water, width, height);",
              "  const { ids: basinIds, basins } = traceGenerationPerformance(\n"
              "    'basin-circulation.label-basins',\n"
              "    {\n"
              "      topologyCells: world.topology.cellCount,\n"
              "      activeCells: layers.water.length,\n"
              "      fullTopologyPasses: 1,\n"
              "      allocatedBufferBytes: layers.water.length * Int32Array.BYTES_PER_ELEMENT\n"
              "    },\n"
              "    () => labelBasins(layers.water, width, height)\n"
              "  );",
              'basin labeling call'
          )
          text = replace_once(
              text,
              "  const coastDistance = basinInteriorDistance(layers.water, basinIds, basins, width, height);",
              "  const coastDistance = traceGenerationPerformance(\n"
              "    'basin-circulation.coast-distance',\n"
              "    {\n"
              "      topologyCells: world.topology.cellCount,\n"
              "      activeCells: layers.water.length,\n"
              "      fullTopologyPasses: 2,\n"
              "      allocatedBufferBytes: layers.water.length * Float32Array.BYTES_PER_ELEMENT\n"
              "    },\n"
              "    () => basinInteriorDistance(layers.water, basinIds, basins, width, height)\n"
              "  );",
              'coast distance call'
          )
          text = replace_once(
              text,
              "  const { gyres, owner } = packGyres(layers.water, basinIds, basins, coastDistance, layers.windX, layers.windY, width, height);",
              "  const { gyres, owner } = traceGenerationPerformance(\n"
              "    'basin-circulation.pack-gyres',\n"
              "    {\n"
              "      topologyCells: world.topology.cellCount,\n"
              "      activeCells: layers.water.length,\n"
              "      fullTopologyPasses: 14,\n"
              "      allocatedBufferBytes: layers.water.length * Int16Array.BYTES_PER_ELEMENT\n"
              "    },\n"
              "    () => packGyres(layers.water, basinIds, basins, coastDistance, layers.windX, layers.windY, width, height)\n"
              "  );",
              'gyre packing call'
          )
          path.write_text(text)
          PY
      - name: Commit profiling seams
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/generator-core/src/basinCirculation.ts
          git commit -m "Profile basin circulation internals"
          git pull --rebase origin agent/promote-polar-profile-performance-bottlenecks
          git push origin HEAD:agent/promote-polar-profile-performance-bottlenecks
