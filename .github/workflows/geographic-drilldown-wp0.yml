name: Geographic Drilldown Diagnostic

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate geographic drilldown slice
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out requested source
        uses: actions/checkout@v5

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Record runtime and source provenance
        run: |
          node --version
          npm --version
          git log -3 --oneline

      - name: Run focused geographic drilldown tests
        run: >-
          npx vitest run
          packages/generator-core/src/geographicAdaptiveScale.test.ts
          packages/generator-core/src/geographicChildPartition.test.ts
          packages/generator-core/src/geographicMacroAreas.test.ts
          packages/generator-core/src/geographicTileWindow.test.ts
          packages/generator-core/src/geographicWidthScale.test.ts
          packages/generator-core/src/geographicSceneBuilder.test.ts
          packages/exporters/src/multiBodyLocalSerialization.test.ts
          packages/exporters/src/multiBodyWforge.test.ts
          apps/desktop/src/regions/geographicRegionPreview.test.ts
          apps/desktop/src/regions/geographicAtlasContextMap.test.ts
          apps/desktop/src/regions/geographicAtlasLayerVisibility.test.ts
          apps/desktop/src/regions/geographicHexScene.test.ts
          apps/desktop/src/regions/geographicSceneInteraction.test.ts
          apps/desktop/src/regions/GeographicSceneViewer.test.ts
          apps/desktop/src/worlds/systemPackageBridge.test.ts
          apps/desktop/src/worlds/systemPackageReadyBridge.test.ts

      - name: Evaluate geographic regions
        run: npm run evaluate:regions
