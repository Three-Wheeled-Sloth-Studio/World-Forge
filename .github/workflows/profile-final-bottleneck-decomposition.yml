name: Profile final bottleneck decomposition

on:
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/profile-final-bottleneck-decomposition.yml

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out profiling branch
        uses: actions/checkout@v5
        with:
          ref: agent/promote-polar-profile-performance-bottlenecks
      - name: Resolve source commit
        run: echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Run standard profile matrix
        run: npm run profile:generation -- --workflow=core.performance-foundation --resolution=512x256 --seeds=1001001,3141592,8675309 --scenarios=earthlike-standard,archipelago-standard,geology-glacial-stress --runs=1 --source-commit=${SOURCE_COMMIT}
      - name: Run production scaling probe
        run: npm run profile:generation -- --workflow=core.performance-foundation --resolution=1024x512 --seeds=1001001,3141592 --scenarios=earthlike-standard --runs=1 --source-commit=${SOURCE_COMMIT}
      - name: Normalize profile paths
        run: |
          set -euo pipefail
          mv "$(ls -1t refs/testing/current-generation-profile-512x256-*.json | head -1)" refs/testing/current-generation-profile-512x256.json
          mv "$(ls -1t refs/testing/current-generation-profile-512x256-*.md | head -1)" refs/testing/current-generation-profile-512x256.md
          mv "$(ls -1t refs/testing/current-generation-profile-1024x512-*.json | head -1)" refs/testing/current-generation-profile-1024x512.json
          mv "$(ls -1t refs/testing/current-generation-profile-1024x512-*.md | head -1)" refs/testing/current-generation-profile-1024x512.md
      - name: Commit decomposed profiles
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refs/testing/current-generation-profile-512x256.json refs/testing/current-generation-profile-512x256.md refs/testing/current-generation-profile-1024x512.json refs/testing/current-generation-profile-1024x512.md
          git commit -m "Record final bottleneck decomposition"
          git pull --rebase origin agent/promote-polar-profile-performance-bottlenecks
          git push origin HEAD:agent/promote-polar-profile-performance-bottlenecks
