version: 1
updated: 2026-09-02
principle: Run the narrowest useful validation during implementation, then the appropriate checkpoint validation before declaring work complete. Not every command applies to every change.
commands:
  - id: case-collisions
    command: npm run check:case-collisions
    purpose: Fail on tracked paths that collide after case-folding.
    use_when: Any file is added, renamed, moved, or an import path changes; also runs automatically before typecheck and build.
  - id: focused-tests
    command: npx vitest run <relevant-test-files>
    purpose: Exercise the smallest relevant regression surface while implementing a change.
    use_when: During ordinary implementation and repair loops.
  - id: validate
    command: npm run validate
    purpose: Run typecheck, the complete Vitest suite, and production harness self-tests.
    use_when: A coherent implementation checkpoint is ready for broader validation.
  - id: verify
    command: npm run verify
    purpose: Run validation plus the production frontend build.
    use_when: Before declaring a functional milestone complete or when build-facing files change.
  - id: production-page-smoke
    command: npm run smoke:production-page-harness
    purpose: Exercise the production page harness through the browser smoke path used by ordinary CI.
    use_when: UI, build, page-harness, or release-facing behavior changes; ordinary CI runs it after npm run verify.
  - id: production-rerank-smoke
    command: npm run smoke:production-rerank
    purpose: Exercise the production attribution rerank browser smoke path used by ordinary CI.
    use_when: Attribution/rerank or release-facing behavior changes; ready pull requests and manual validation checkpoints run it after npm run verify.
  - id: dependency-audit
    command: npm audit
    purpose: Check the current dependency graph for known vulnerabilities.
    use_when: Dependencies, lockfiles, package overrides, or security-sensitive build inputs change; also during intentional security review.
  - id: fictional-preset-matrix
    command: npm run validate:presets -- --mode full
    purpose: Run the repeated fictional preset matrix through the native production generation path and record preset-level diagnostics.
    use_when: An intentional preset/generator diagnostic checkpoint needs broad fictional-world evidence. This is manual-only and must never be added to ordinary push CI.
  - id: geographic-evaluation
    command: npm run evaluate:regions
    purpose: Run deterministic geographic-region quality evaluation.
    use_when: Geographic partitioning, drilldown, tile-window, or related generation behavior changes.
  - id: geographic-diagnostic-ci
    command: GitHub Actions -> Geographic Drilldown Diagnostic -> Run workflow
    purpose: Run the focused geographic drilldown regression and evaluation suite in a clean remote environment.
    use_when: Geographic work needs an intentional remote diagnostic checkpoint. This workflow is manual-only and is not authoritative repository CI.
  - id: ultra-earth-reference-diagnostic
    command: GitHub Actions -> Ultra Earth Reference Diagnostic -> Run workflow
    purpose: Rebuild the maintained real-source Earth/Sol reference and capture source, package, timing, and memory evidence.
    use_when: Maintained source inputs, reference ETL, reference packaging, or the Ultra Earth contract changes. This is intentionally not ordinary push CI.
  - id: downstream-earth-fast
    command: npm run validate:downstream-earth:fast
    purpose: Run the maintained Earth physical surface through production downstream climate, hydrology, biome, and circulation stages and compare component metrics with the Fast baseline.
    use_when: Iterating on downstream generator behavior. This is an intentional local diagnostic, not ordinary push CI.
  - id: downstream-earth-standard
    command: npm run validate:downstream-earth:standard
    purpose: Run the fixed-grid Earth plausibility metrics and performance comparison at 1024 x 512 / topology 256.
    use_when: A downstream generator change reaches a scientific-validation checkpoint. This remains outside ordinary push CI.
  - id: downstream-earth-ultra
    command: npm run validate:downstream-earth:ultra
    purpose: Run the maintained 4096 x 2048 / topology 1024 Earth downstream diagnostic and compare against its manual baseline.
    use_when: An intentional maintained-Earth or scaling checkpoint requires Ultra evidence. Never add this to ordinary push CI.
  - id: prepare-glwd-reference
    command: uv run scripts/prepare-glwd-reference.py --source-directory=<extracted GLWD combined GeoTIFF directory> --output=.local/reference-data/glwd-v2-derived --resolution=4096x2048
    purpose: Reduce the CC BY 4.0 GLWD v2 fractional and dominant-class GeoTIFFs into an ignored local wetland-validation bundle.
    use_when: Preparing or refreshing the optional observed-wetland slice. Never download or prepare GLWD in ordinary push CI.
notes:
  - Ordinary dev/release validation is one job: npm ci, npm run verify, and the production page-harness smoke. Ready pull requests and manual checkpoints also run the production rerank smoke.
  - Manual validation exposes a full_test_matrix input that restores the extended generation and geographic seed matrices.
  - The fictional preset matrix is intentionally manual. Its retired plate-advection-v3 expectation is validation-contract debt; current production plate diagnostics use fragment-placement-v2. See refs/testing/plate-diagnostic-contract-audit-2026-09-02.md.
  - QA and main are exact-SHA promotion targets. Deployment requires a successful Validate World Forge run for the exact source SHA and then performs build-only compilation/bundling.
  - The former dedicated Ultra Earth acceptance workflow was removed after owner acceptance because its tests and full verification duplicated the ordinary suite.
  - Real scientific-source rebuilds and geographic evaluation remain intentional diagnostics because they provide evidence ordinary CI does not.
  - Downstream Earth validation uses observed elevation plus derived Köppen wetness/biome/ice answer keys. Fast, Standard, and Ultra runs are manual diagnostics; only framework math and small deterministic contracts belong in routine tests.
  - Catchment-budget wetlands are the production default. Use --lowland-floodplain-wetlands for the immediate predecessor comparator or --legacy-wetland-hydrology for the older comparator when invoking the Earth runner directly.
