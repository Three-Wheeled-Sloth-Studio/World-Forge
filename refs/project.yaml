  - id: tws-design-principles
    repository: Three-Wheeled-Sloth-Studio/TWS-Design-Principles
    status: active
    application: Apply relevant shared product, application, engineering, UI, and release principles; record World Forge deviations locally.
  - id: agent-academy
    repository: Three-Wheeled-Sloth-Studio/Agent-Academy
    status: active-profile
    application: Use the Agent Academy OKF-compatible profile for discovery, provenance, and interoperability while preserving World Forge's mature project-specific refs taxonomy and deterministic YAML state.
  - id: tws-agentic-harness
    repository: Three-Wheeled-Sloth-Studio/TWS-Agentic-Harness
    status: reference
    application: Use its feedback-governance controls for coding-agent repair loops. It is not a World Forge runtime dependency.
local_reference_access:
  environment_variable: TWS_REFERENCE_HOME
  note: Optional local checkout pointer for TWS-Design-Principles. GitHub-backed agents may read the canonical repository directly.
